<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Tumaini CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#153E35',
              darker: '#0F2D27',
              deep: '#0B221D',
              gold: '#D4973B',
              goldHover: '#BF8229',
              mint: '#EAF3EF',
              surface: '#F8FAF9',
              border: '#E2E8F0'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-brand-deep via-brand-dark to-brand-darker min-h-screen flex items-center justify-center p-4">
  
  <div class="w-full max-w-md">
    <!-- Logo & Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-gold mb-4">
        <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white">Tumaini CMS</h1>
      <p class="text-brand-mint mt-2">Administrative Dashboard</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8 mb-6">
      <h2 class="text-xl font-bold text-slate-900 mb-6">Admin Login</h2>

      <!-- Error Alert -->
      <div id="errorAlert" class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-red-700 text-sm font-medium" id="errorMessage"></p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-4">
        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-gold focus:border-transparent transition"
            placeholder="admin@tumaini.school"
          >
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-gold focus:border-transparent transition"
            placeholder="••••••••"
          >
        </div>

        <!-- Remember Me -->
        <div class="flex items-center">
          <input 
            type="checkbox" 
            id="remember" 
            name="remember" 
            class="w-4 h-4 rounded border-slate-300 text-brand-gold focus:ring-brand-gold cursor-pointer"
          >
          <label for="remember" class="ml-2 text-sm text-slate-600 cursor-pointer">Remember me</label>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="loginBtn"
          class="w-full py-2.5 bg-brand-dark text-white font-semibold rounded-lg hover:bg-brand-darker transition duration-200 flex items-center justify-center gap-2"
        >
          <span id="loginText">Sign In</span>
          <svg id="loadingSpinner" class="hidden w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </form>
    </div>

    <!-- Help Text -->
    <div class="bg-white/10 backdrop-blur rounded-lg p-4 text-center">
      <p class="text-brand-mint text-sm">
        Default credentials:<br>
        <span class="font-mono text-xs">admin@tumaini.school / Admin123!</span>
      </p>
      <p class="text-slate-400 text-xs mt-3">⚠️ Change password after first login</p>
    </div>
  </div>

  <script>
    const apiUrl = localStorage.getItem('apiUrl') || 'http://localhost:3001';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('remember').checked;

      const loginBtn = document.getElementById('loginBtn');
      const loginText = document.getElementById('loginText');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');

      // Reset error
      errorAlert.classList.add('hidden');

      // Show loading state
      loginBtn.disabled = true;
      loginText.textContent = 'Signing In...';
      loadingSpinner.classList.remove('hidden');

      try {
        console.log('Attempting login to:', `${apiUrl}/api/auth/login`);
        
        const response = await fetch(`${apiUrl}/api/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        console.log('Response status:', response.status);
        const data = await response.json();
        console.log('Response data:', data);

        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Store token
        localStorage.setItem('authToken', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        if (rememberMe) {
          localStorage.setItem('rememberEmail', email);
        }

        // Redirect to dashboard
        window.location.href = '/admin/dashboard.html';

      } catch (error) {
        console.error('Login error:', error);
        
        // Better error messages
        let errorMsg = error.message;
        if (error.message.includes('fetch')) {
          errorMsg = 'Cannot connect to server. Make sure backend is running on port 3001.';
        } else if (error.message.includes('NetworkError')) {
          errorMsg = 'Network error. Check if backend server is running.';
        }
        
        errorMessage.textContent = errorMsg;
        errorAlert.classList.remove('hidden');

        // Reset button
        loginBtn.disabled = false;
        loginText.textContent = 'Sign In';
        loadingSpinner.classList.add('hidden');
      }
    });

    // Pre-fill email if remembered
    window.addEventListener('load', () => {
      const rememberEmail = localStorage.getItem('rememberEmail');
      if (rememberEmail) {
        document.getElementById('email').value = rememberEmail;
        document.getElementById('remember').checked = true;
      }
    });
  </script>
</body>
</html>
