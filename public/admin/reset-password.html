<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Tumaini CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  
  <div class="w-full max-w-md">
    <!-- Reset Password Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      
      <!-- Header with Logo -->
      <div class="mb-6">
        <div class="flex items-center gap-3 mb-3">
          <img src="/assets/images/logo.png" alt="Tumaini Logo" class="w-14 h-14 object-contain">
          <div>
            <p class="text-xs text-gray-600 font-medium uppercase tracking-wide">TUMAINI CMS</p>
            <h1 class="text-xl font-semibold text-gray-900">Reset Password</h1>
          </div>
        </div>
        <p class="text-sm text-gray-600">Enter your new password below</p>
      </div>

      <!-- Success Alert -->
      <div id="successAlert" class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded-lg">
        <p class="text-green-700 text-sm font-medium">✓ Password reset successful! Redirecting to login...</p>
      </div>

      <!-- Error Alert -->
      <div id="errorAlert" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-red-700 text-sm" id="errorMessage"></p>
      </div>

      <!-- Reset Password Form -->
      <form id="resetForm" class="space-y-4">
        <!-- New Password Field -->
        <div>
          <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1.5">New Password</label>
          <div class="relative">
            <input 
              type="password" 
              id="newPassword" 
              name="newPassword" 
              required 
              minlength="8"
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition pr-10"
              placeholder="••••••••"
            >
            <button 
              type="button" 
              id="toggleNew"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none"
            >
              <svg class="eye-icon w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
          <p class="text-xs text-gray-500 mt-1">Minimum 8 characters</p>
        </div>

        <!-- Confirm Password Field -->
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
          <div class="relative">
            <input 
              type="password" 
              id="confirmPassword" 
              name="confirmPassword" 
              required 
              minlength="8"
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition pr-10"
              placeholder="••••••••"
            >
            <button 
              type="button" 
              id="toggleConfirm"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none"
            >
              <svg class="eye-icon w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="resetBtn"
          class="w-full py-2.5 bg-teal-700 text-white font-medium rounded-lg hover:bg-teal-800 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 transition duration-150 flex items-center justify-center gap-2"
        >
          <span id="resetText">Reset Password</span>
          <svg id="loadingSpinner" class="hidden w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </form>

      <div class="mt-4 text-center">
        <a href="/admin/login.html" class="text-sm text-teal-600 hover:text-teal-700 font-medium">
          Back to login
        </a>
      </div>
    </div>
  </div>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://sdqlyzfcffhmmwmxuhrc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcWx5emZjZmZobW13bXh1aHJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NTA0NTYsImV4cCI6MjEwNzEyNjQ1Nn0.LVtj6Tdu9txB1-NUUXQ_it5Sqt4I0PVxCID2WWHu9ec';
    
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Check if user came from password reset email
    window.addEventListener('load', async () => {
      // Supabase automatically handles the token in the URL hash
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      
      if (error || !session) {
        // No valid session from reset link
        document.getElementById('errorMessage').textContent = 'Invalid or expired reset link. Please request a new one.';
        document.getElementById('errorAlert').classList.remove('hidden');
        document.getElementById('resetForm').style.display = 'none';
        
        // Show link to login
        setTimeout(() => {
          window.location.href = '/admin/login.html';
        }, 3000);
      } else {
        console.log('Valid password reset session detected');
      }
    });

    // Toggle password visibility
    function setupToggle(toggleId, inputId) {
      document.getElementById(toggleId).addEventListener('click', function() {
        const input = document.getElementById(inputId);
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    }

    setupToggle('toggleNew', 'newPassword');
    setupToggle('toggleConfirm', 'confirmPassword');

    // Handle form submission with Supabase
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      const resetBtn = document.getElementById('resetBtn');
      const resetText = document.getElementById('resetText');
      const loadingSpinner = document.getElementById('loadingSpinner');
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      const successAlert = document.getElementById('successAlert');

      // Reset alerts
      errorAlert.classList.add('hidden');
      successAlert.classList.add('hidden');

      // Validate passwords match
      if (newPassword !== confirmPassword) {
        errorMessage.textContent = 'Passwords do not match';
        errorAlert.classList.remove('hidden');
        return;
      }

      // Validate password strength
      if (newPassword.length < 8) {
        errorMessage.textContent = 'Password must be at least 8 characters';
        errorAlert.classList.remove('hidden');
        return;
      }

      // Show loading
      resetBtn.disabled = true;
      resetText.textContent = 'Resetting...';
      loadingSpinner.classList.remove('hidden');

      try {
        // Update password using Supabase
        const { data, error } = await supabaseClient.auth.updateUser({
          password: newPassword
        });

        if (error) {
          throw error;
        }

        console.log('Password updated successfully!', data);

        // Show success
        successAlert.classList.remove('hidden');

        // Sign out to force fresh login with new password
        await supabaseClient.auth.signOut();

        // Redirect to login after 2 seconds
        setTimeout(() => {
          window.location.href = '/admin/login.html';
        }, 2000);

      } catch (error) {
        console.error('Reset error:', error);
        errorMessage.textContent = error.message || 'Password reset failed';
        errorAlert.classList.remove('hidden');

        // Reset button
        resetBtn.disabled = false;
        resetText.textContent = 'Reset Password';
        loadingSpinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
