<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Image Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8">
        <h1 class="text-2xl font-bold mb-6">Test Image Upload</h1>
        
        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2">1. Login First:</label>
            <input type="email" id="email" placeholder="admin@tumaini.school" class="w-full px-4 py-2 border rounded mb-2">
            <input type="password" id="password" placeholder="Admin123!" class="w-full px-4 py-2 border rounded mb-2">
            <button onclick="login()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Login</button>
            <p id="loginStatus" class="text-sm mt-2"></p>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2">2. Upload Image:</label>
            <input type="file" id="imageFile" accept="image/*" class="mb-2">
            <button onclick="uploadImage()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">Upload</button>
        </div>

        <div class="mb-6">
            <h3 class="font-semibold mb-2">Upload Result:</h3>
            <pre id="result" class="bg-gray-100 p-4 rounded text-xs overflow-auto max-h-96"></pre>
        </div>

        <div id="preview" class="hidden">
            <h3 class="font-semibold mb-2">Image Preview:</h3>
            <img id="previewImg" src="" alt="Preview" class="max-w-full h-auto rounded-lg border-2 border-gray-300">
        </div>
    </div>

    <script>
        const apiUrl = 'http://localhost:3001';
        let authToken = localStorage.getItem('authToken');

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusEl = document.getElementById('loginStatus');

            try {
                statusEl.textContent = 'Logging in...';
                const response = await fetch(`${apiUrl}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    statusEl.textContent = '✅ Login successful!';
                    statusEl.className = 'text-sm mt-2 text-green-600 font-semibold';
                } else {
                    statusEl.textContent = '❌ Login failed: ' + data.error;
                    statusEl.className = 'text-sm mt-2 text-red-600 font-semibold';
                }
            } catch (error) {
                statusEl.textContent = '❌ Error: ' + error.message;
                statusEl.className = 'text-sm mt-2 text-red-600 font-semibold';
            }
        }

        async function uploadImage() {
            const fileInput = document.getElementById('imageFile');
            const resultEl = document.getElementById('result');
            const previewDiv = document.getElementById('preview');
            const previewImg = document.getElementById('previewImg');

            if (!authToken) {
                resultEl.textContent = '❌ Please login first!';
                return;
            }

            if (!fileInput.files[0]) {
                resultEl.textContent = '❌ Please select a file!';
                return;
            }

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                resultEl.textContent = 'Uploading...';
                
                const response = await fetch(`${apiUrl}/api/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: formData
                });

                const data = await response.json();
                
                resultEl.textContent = JSON.stringify({
                    status: response.status,
                    statusText: response.statusText,
                    data: data
                }, null, 2);

                if (response.ok) {
                    // Show preview
                    previewImg.src = '../' + data.path;
                    previewDiv.classList.remove('hidden');
                    resultEl.className = 'bg-green-50 p-4 rounded text-xs overflow-auto max-h-96';
                } else {
                    resultEl.className = 'bg-red-50 p-4 rounded text-xs overflow-auto max-h-96';
                }
            } catch (error) {
                resultEl.textContent = '❌ Upload Error:\n' + error.message + '\n\nMake sure backend is running on port 3001';
                resultEl.className = 'bg-red-50 p-4 rounded text-xs overflow-auto max-h-96';
            }
        }

        // Auto-fill credentials if stored
        window.onload = function() {
            if (authToken) {
                document.getElementById('loginStatus').textContent = '✅ Already logged in (token found)';
                document.getElementById('loginStatus').className = 'text-sm mt-2 text-green-600 font-semibold';
            }
        };
    </script>
</body>
</html>
